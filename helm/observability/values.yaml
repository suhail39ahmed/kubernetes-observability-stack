# Observability stack: Prometheus Operator + Grafana + Alertmanager + Loki
fullnameOverride: observability

prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 500m
        memory: 2Gi

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-default'
      routes:
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
    receivers:
      - name: 'slack-default'
        slack_configs:
          - send_resolved: true
            channel: '#alerts'
            api_url: '$SLACK_WEBHOOK'
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - send_resolved: true
            routing_key: '$PAGERDUTY_KEY'

grafana:
  enabled: true
  adminPassword: ''  # set via secret in prod
  persistence:
    enabled: true
    size: 10Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://observability-prometheus:9090
          access: proxy
        - name: Loki
          type: loki
          url: http://observability-loki:3100
          access: proxy

loki:
  enabled: true
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: 'filesystem'
  singleBinary:
    replicas: 1
    persistence:
      size: 10Gi
